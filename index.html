<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus Player</title>
  <style>
    :root {
      color-scheme: dark;
      --graphite-950: #08090B;
      --graphite-900: #0D0F12;
      --graphite-850: #12151A;
      --graphite-800: #171A20;
      --graphite-750: #1C2026;
      --graphite-700: #242830;
      --text-primary: #F2F3F5;
      --text-secondary: #B7BBC2;
      --text-tertiary: #858B94;
      --text-disabled: #5F646D;
      --border-subtle: rgba(255,255,255,0.055);
      --border-standard: rgba(255,255,255,0.075);
      --border-strong: rgba(255,255,255,0.11);
      --control-idle: rgba(255,255,255,0.70);
      --control-hover: rgba(255,255,255,0.95);
      --progress-background: rgba(255,255,255,0.22);
      --progress-active: rgba(255,255,255,0.88);
      --bg: var(--graphite-950);
      --panel: var(--graphite-850);
      --panel-soft: rgba(18, 21, 26, .97);
      --text: var(--text-primary);
      --muted: var(--text-secondary);
      --accent: rgba(255,255,255,0.10);
      --accent-hover: rgba(255,255,255,0.18);
      --border: var(--border-standard);
      --control-size: 40px;
      --player-control: rgba(255, 255, 255, .72);
      --player-control-hover: rgba(255, 255, 255, .95);
      --player-control-disabled: rgba(255, 255, 255, .38);
      --player-control-bg: rgba(255, 255, 255, .06);
      --player-panel-bg: rgba(18, 21, 26, .97);
      --player-track: rgba(255, 255, 255, .2);
      --player-progress: rgba(255, 255, 255, .88);
      --player-thumb: rgba(255, 255, 255, .95);
      --player-glow: rgba(0, 0, 0, .36);
      --shadow-elevated: 0 18px 45px rgba(0, 0, 0, .35);
      --shadow-float: 0 8px 28px rgba(0, 0, 0, .28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 0%, rgba(139, 124, 255, 0.08), transparent 32%),
        var(--bg);
    }

    button,
    textarea,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.85);
      outline-offset: 3px;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
    }

    [hidden] {
      display: none !important;
    }

    #home {
      display: block;
      min-height: 100vh;
      overflow: auto;
      padding: 7vh 24px 48px;
    }

    .home-card {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: clamp(24px, 5vw, 52px);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(16,18,24,0.96), rgba(9,10,15,0.96));
      box-shadow: var(--shadow-elevated);
    }

    .eyebrow {
      display: none;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 18px;
      font-size: clamp(2.1rem, 5vw, 3.2rem);
      line-height: 1.05;
      letter-spacing: -.06em;
      font-weight: 700;
      color: var(--text);
    }

    .intro {
      display: none;
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: var(--text-secondary);
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 156px;
      resize: vertical;
      padding: 16px 18px;
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      background: rgba(9, 10, 15, 0.7);
      color: var(--text);
      line-height: 1.6;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    textarea:hover {
      border-color: var(--border-visible);
    }

    textarea:focus {
      border-color: rgba(255, 255, 255, 0.34);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.08);
      background: rgba(13, 15, 20, 0.9);
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
    }

    .hint {
      margin: 0;
      color: var(--text-muted);
      font-size: .78rem;
      line-height: 1.45;
    }

    .primary-btn,
    .modal-btn {
      border: 0;
      border-radius: 10px;
      background: linear-gradient(180deg, var(--accent), #7B6AF4);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
      box-shadow: 0 8px 16px rgba(139, 124, 255, 0.22);
    }

    .primary-btn {
      min-width: 122px;
      padding: 12px 22px;
    }

    .primary-btn:hover,
    .modal-btn:hover {
      background: linear-gradient(180deg, var(--accent-hover), #8F84FF);
      box-shadow: 0 10px 20px rgba(139, 124, 255, 0.25);
    }

    .primary-btn:active,
    .modal-btn:active {
      transform: translateY(1px);
    }

    #apiError {
      position: fixed;
      z-index: 200;
      top: 18px;
      left: 50%;
      width: min(660px, calc(100% - 32px));
      margin: 0;
      padding: 13px 16px;
      border: 1px solid rgba(255, 100, 100, .5);
      border-radius: 10px;
      background: rgba(110, 0, 0, .45);
      color: #ffd7d7;
      font-size: .9rem;
      line-height: 1.45;
      transform: translateX(-50%);
    }

    #playerPage {
      display: none;
      position: fixed;
      z-index: 10;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    /* Fullscreen may be requested for the app shell (our modal/overlays stay
       inside it) or by YouTube for its own iframe. Size either target explicitly. */
    #playerPage:fullscreen,
    .video-shell:fullscreen,
    #playerPage:-webkit-full-screen,
    .video-shell:-webkit-full-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      margin: 0;
      overflow: visible;
      background: #000;
    }

    #playerPage:fullscreen .video-shell,
    #playerPage:-webkit-full-screen .video-shell {
      width: 100%;
      height: 100%;
    }

    #player:fullscreen,
    #player iframe:fullscreen,
    #player:-webkit-full-screen,
    #player iframe:-webkit-full-screen {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      border: 0;
      background: #000;
    }

    .video-shell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: visible;
      background: #000;
      isolation: isolate;
    }

    #player,
    #player iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .app-close-btn {
      position: absolute;
      right: 16px;
      bottom: 80px;
      z-index: 30;
      display: inline-grid;
      place-items: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      cursor: pointer;
      opacity: 1;
      pointer-events: auto;
      transition: opacity .18s ease, background .15s ease, transform .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .app-close-btn svg {
      display: block;
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .app-close-btn:hover,
    .app-close-btn:active {
      background: rgba(255, 255, 255, .15);
    }

    .app-close-btn:active {
      transform: scale(.96);
    }

    .video-shell.ui-idle .app-close-btn,
    .video-shell.modal-open .app-close-btn {
      opacity: 0;
      pointer-events: none;
    }

    #positionLabel {
      transition: opacity .18s ease;
    }

    .video-shell.ui-idle #positionLabel {
      opacity: 0;
    }

    /* These transparent shields sit above the cross-origin iframe. They block
       only likely title/navigation hotspots; the native control strip remains clear. */
    .youtube-shield {
      position: absolute;
      z-index: 5;
      display: block;
      background: transparent;
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .activity-overlay {
      position: absolute;
      z-index: 4;
      inset: 0;
      background: transparent;
      pointer-events: none;
    }

    .youtube-shield--top {
      top: 0;
      left: 0;
      width: min(64vw, 760px);
      height: 96px;
    }

    .youtube-shield--bottom-right {
      right: 0;
      bottom: 0;
      width: min(24vw, 420px);
      height: 108px;
    }

    #positionLabel {
      position: absolute;
      z-index: 5;
      top: 18px;
      left: 16px;
      padding: 6px 9px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 7px;
      background: rgba(8, 9, 11, .68);
      color: rgba(242, 243, 245, .82);
      font-size: .72rem;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    #playerMessage {
      position: absolute;
      z-index: 6;
      top: 50%;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: min(90vw, 520px);
      padding: 14px 17px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 10px;
      background: rgba(12, 12, 12, .9);
      box-shadow: 0 12px 45px rgba(0, 0, 0, .45);
      color: #fff;
      transform: translate(-50%, -50%);
    }

    #playerMessageText {
      font-size: .92rem;
      line-height: 1.4;
    }

    .notice-action {
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 6px;
      background: #fff;
      color: #111;
      font-size: .78rem;
      font-weight: 800;
    }

    .notice-action:hover {
      background: #e5e5e5;
    }

    #confirmModal {
      position: absolute;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(0, 0, 0, .78);
    }

    .modal-card {
      position: relative;
      width: min(520px, 100%);
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 16px;
      background: #191919;
      box-shadow: 0 26px 100px rgba(0, 0, 0, .62);
    }

    .modal-card h2 {
      margin-bottom: 10px;
      font-size: 1.35rem;
    }

    .modal-card p {
      margin-bottom: 18px;
      color: #bdbdbd;
      line-height: 1.55;
    }

    .accountability-sentence {
      display: block;
      margin: 0 0 17px;
      padding: 12px 13px;
      border-left: 3px solid var(--accent);
      background: rgba(255, 255, 255, .06);
      color: #fff;
      font-size: .9rem;
      line-height: 1.5;
    }

    #confirmInput {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 9px;
      background: #0e0e0e;
      color: #fff;
    }

    #confirmInput.invalid {
      animation: invalidInput .35s ease;
      border-color: #ff4d4d;
      background: rgba(130, 0, 0, .28);
    }

    @keyframes invalidInput {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-btn {
      padding: 10px 15px;
    }

    .modal-btn.secondary {
      background: rgba(255, 255, 255, .1);
    }

    .modal-btn.secondary:hover {
      background: rgba(255, 255, 255, .18);
    }

    .modal-abort {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 7px;
      background: transparent;
      color: #c5c5c5;
      font-size: 1.5rem;
      line-height: 1;
      transition: background .15s ease;
    }

    .modal-abort:hover {
      background: rgba(255, 255, 255, .12);
      color: #fff;
    }

    @media (max-width: 680px) {
      .app-close-btn {
        right: 8px;
        bottom: 70px;
      }

      .youtube-shield--top {
        width: 82vw;
        height: 82px;
      }

      .youtube-shield--bottom-right {
        width: 42vw;
        height: min(21vh, 140px);
        min-height: 72px;
        bottom: 0;
      }

      #positionLabel {
        top: 12px;
        left: 10px;
        font-size: .66rem;
      }

      .form-row {
        align-items: stretch;
        flex-direction: column;
      }

      .primary-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main id="home">
    <section class="home-card" aria-labelledby="homeTitle">
      <p class="eyebrow">Focus Player</p>
      <h1 id="homeTitle">Focus Player</h1>

      <label for="links">Paste one YouTube link or video ID per line</label>
      <textarea id="links" autocomplete="off" spellcheck="false" placeholder="https://www.youtube.com/watch?v=...\nhttps://youtu.be/...\n..."></textarea>
      <div class="form-row">
        <p class="hint">One link or ID per line. Invalid entries are ignored.</p>
        <button id="startBtn" class="primary-btn" type="button">Start</button>
      </div>
    </section>
  </main>

  <p id="apiError" hidden role="alert"></p>

  <section id="playerPage" aria-label="Focus Player video">
    <div id="videoShell" class="video-shell">
      <div id="player"></div>
      <div id="activityOverlay" class="activity-overlay" aria-hidden="true"></div>
      <div id="positionLabel" aria-live="polite">Video 1 of 1</div>

      <div id="playerMessage" hidden role="status">
        <span id="playerMessageText"></span>
        <button id="errorNextBtn" class="notice-action" type="button" hidden>Skip to next</button>
      </div>

      <!-- Transparent click shields block only the title region and a bottom-right
           suggestion/branding hotspot. They do not cover the native control strip. -->
      <div id="titleShield" class="youtube-shield youtube-shield--top" aria-hidden="true"></div>
      <div id="endScreenShield" class="youtube-shield youtube-shield--bottom-right" aria-hidden="true"></div>

      <button id="closeBtn" class="app-close-btn" type="button" aria-label="Close Focus Player" title="Close Focus Player">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M10 3H5.5A1.5 1.5 0 0 0 4 4.5v15A1.5 1.5 0 0 0 5.5 21H10" />
          <path d="M13 8l4 4-4 4" />
          <path d="M8 12h9" />
        </svg>
      </button>

      <div id="confirmModal" hidden role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="modal-card">
          <button id="modalAbort" class="modal-abort" type="button" aria-label="Cancel and close confirmation">&times;</button>
          <h2 id="confirmTitle">Before you leave</h2>
          <p>To continue, type the accountability sentence exactly as shown.</p>
          <span class="accountability-sentence">I definitely completed the target. Karma aur Descipline ka samman hua hai.</span>
          <input id="confirmInput" type="text" autocomplete="off" spellcheck="false" aria-label="Type the accountability sentence">
          <div class="modal-actions">
            <button id="modalCancel" class="modal-btn secondary" type="button">Cancel</button>
            <button id="modalCheck" class="modal-btn" type="button">Check</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    // The API can call this before the app script below is evaluated.
    window.focusPlayerApiReady = false;
    window.focusPlayerApiFailed = false;
    window.onYouTubeIframeAPIReady = function () {
      window.focusPlayerApiReady = true;
      if (typeof window.focusPlayerBoot === "function") {
        window.focusPlayerBoot();
      }
    };
    window.handleYouTubeApiError = function () {
      window.focusPlayerApiFailed = true;
      var error = document.getElementById("apiError");
      if (error) {
        error.textContent = "The YouTube player failed to load. Check your connection and reload the page.";
        error.hidden = false;
      }
      if (typeof window.focusPlayerShowApiError === "function") {
        window.focusPlayerShowApiError();
      }
    };
  </script>
  <script src="https://www.youtube.com/iframe_api" onerror="window.handleYouTubeApiError()"></script>
  <script>
    (() => {
      "use strict";

      const PLAYLIST_KEY = "focusPlayer.playlist";
      const INDEX_KEY = "focusPlayer.index";
      const PROGRESS_KEY = "focusPlayer.progress";
      const SPEED_KEY = "focusPlayer.speed";
      const VALID_ID = /^[A-Za-z0-9_-]{6,}$/;
      const ACCEPTED_TEXTS = [
        "I definitely completed the target. Karma aur Descipline ka samman hua hai.",
        "I definitely completed the target. Karma aur Discipline ka samman hua hai."
      ];

      const home = document.getElementById("home");
      const links = document.getElementById("links");
      const startBtn = document.getElementById("startBtn");
      const playerPage = document.getElementById("playerPage");
      const videoShell = document.getElementById("videoShell");
      const activityOverlay = document.getElementById("activityOverlay");
      const closeBtn = document.getElementById("closeBtn");
      const positionLabel = document.getElementById("positionLabel");
      const playerMessage = document.getElementById("playerMessage");
      const playerMessageText = document.getElementById("playerMessageText");
      const errorNextBtn = document.getElementById("errorNextBtn");
      const apiError = document.getElementById("apiError");
      const confirmModal = document.getElementById("confirmModal");
      const confirmInput = document.getElementById("confirmInput");
      const modalCheck = document.getElementById("modalCheck");
      const modalCancel = document.getElementById("modalCancel");
      const modalAbort = document.getElementById("modalAbort");

      const PLAYBACK_RATE_MIN = 0.25;
      const PLAYBACK_RATE_MAX = 4;
      const PLAYBACK_RATE_STEP = 0.05;

      let player = null;
      let playlist = [];
      let currentIndex = 0;
      let currentVideoId = "";
      let progressIntervalId = null;
      let customUiHideTimeoutId = null;
      let pendingAction = null;
      let isPlaying = false;
      let playbackRate = 1;
      let apiErrorShown = false;
      let allowPageUnload = false;
      let navigationGuardInstalled = false;

      function storageGet(key) {
        try {
          return window.localStorage.getItem(key);
        } catch (error) {
          return null;
        }
      }

      function storageSet(key, value) {
        try {
          window.localStorage.setItem(key, value);
        } catch (error) {
          // Playback remains usable even if storage is unavailable.
        }
      }

      function storageRemove(key) {
        try {
          window.localStorage.removeItem(key);
        } catch (error) {
          // Nothing else is needed if storage is unavailable.
        }
      }

      function validVideoId(id) {
        return typeof id === "string" && VALID_ID.test(id);
      }

      function extractVideoId(line) {
        const value = String(line || "").trim();
        if (validVideoId(value)) {
          return value;
        }

        let candidate = value;
        if (/^www\./i.test(candidate)) {
          candidate = "https://" + candidate;
        }

        let url;
        try {
          url = new URL(candidate);
        } catch (error) {
          return null;
        }

        const host = url.hostname.toLowerCase().replace(/^www\./, "");
        const parts = url.pathname.split("/").filter(Boolean);
        let id = null;

        if (host === "youtu.be") {
          id = parts[0] || null;
        } else if (host === "youtube.com" || host === "m.youtube.com") {
          if (url.pathname === "/watch") {
            id = url.searchParams.get("v");
          } else if (["embed", "shorts"].includes(parts[0])) {
            id = parts[1] || null;
          }
        }

        return validVideoId(id) ? id : null;
      }

      function parseLinks(value) {
        return String(value || "")
          .split(/\r?\n/)
          .map(extractVideoId)
          .filter(Boolean);
      }

      function getStoredPlaylist() {
        try {
          const saved = JSON.parse(storageGet(PLAYLIST_KEY) || "[]");
          if (!Array.isArray(saved)) {
            return [];
          }
          return saved.filter(validVideoId);
        } catch (error) {
          return [];
        }
      }

      function getProgressMap() {
        try {
          const saved = JSON.parse(storageGet(PROGRESS_KEY) || "{}");
          return saved && typeof saved === "object" && !Array.isArray(saved) ? saved : {};
        } catch (error) {
          return {};
        }
      }

      function getResumeTime(videoId) {
        const value = Number(getProgressMap()[videoId]);
        return Number.isFinite(value) && value >= 0 ? value : 0;
      }

      function normalizePlaybackRate(value) {
        if (!Number.isFinite(Number(value))) {
          return 1;
        }
        const clamped = Math.min(PLAYBACK_RATE_MAX, Math.max(PLAYBACK_RATE_MIN, Number(value)));
        return Number((Math.round(clamped / PLAYBACK_RATE_STEP) * PLAYBACK_RATE_STEP).toFixed(2));
      }

      function getSavedSpeed() {
        const saved = storageGet(SPEED_KEY) || "1";
        return normalizePlaybackRate(Number(saved) || 1);
      }

      function persistIndex() {
        // Keep this string conversion explicit: localStorage stores strings.
        storageSet(INDEX_KEY, String(currentIndex));
      }

      function formatTime(seconds) {
        const safeSeconds = Math.max(0, Math.floor(Number(seconds) || 0));
        const hours = Math.floor(safeSeconds / 3600);
        const minutes = Math.floor((safeSeconds % 3600) / 60);
        const remainder = safeSeconds % 60;
        return [hours, minutes, remainder].map((part) => String(part).padStart(2, "0")).join(":");
      }

      function showApiError() {
        if (apiErrorShown) {
          return;
        }
        apiErrorShown = true;
        apiError.textContent = "The YouTube player failed to load. Check your connection and reload the page.";
        apiError.hidden = false;
      }

      window.focusPlayerShowApiError = showApiError;

      function showPlayerPage() {
        home.style.display = "none";
        playerPage.style.display = "block";
      }

      function updatePositionLabel() {
        if (!playlist.length) {
          positionLabel.textContent = "No videos loaded";
          return;
        }
        const displayedIndex = Math.min(Math.max(currentIndex + 1, 1), playlist.length);
        positionLabel.textContent = `Video ${displayedIndex} of ${playlist.length}`;
      }

      function clearCustomUiHideTimer() {
        if (customUiHideTimeoutId !== null) {
          window.clearTimeout(customUiHideTimeoutId);
          customUiHideTimeoutId = null;
        }
      }

      function revealCustomUi() {
        clearCustomUiHideTimer();
        videoShell.classList.remove("ui-idle");
        if (confirmModal.hidden && isPlaying) {
          customUiHideTimeoutId = window.setTimeout(() => {
            customUiHideTimeoutId = null;
            if (confirmModal.hidden && isPlaying) {
              videoShell.classList.add("ui-idle");
            }
          }, 2000);
        }
      }

      function pinCustomUiVisible() {
        clearCustomUiHideTimer();
        videoShell.classList.remove("ui-idle");
      }

      function setPlayerMessage(message, showSkip) {
        playerMessageText.textContent = message;
        errorNextBtn.hidden = !showSkip;
        playerMessage.hidden = false;
      }

      function clearPlayerMessage() {
        playerMessage.hidden = true;
        errorNextBtn.hidden = true;
      }

      function saveProgress() {
        if (!player || !currentVideoId || typeof player.getCurrentTime !== "function") {
          return;
        }
        const state = typeof player.getPlayerState === "function" ? player.getPlayerState() : null;
        if (!isPlaying && state !== window.YT?.PlayerState?.PLAYING) {
          return;
        }
        const current = Number(player.getCurrentTime());
        if (!Number.isFinite(current) || current < 0) {
          return;
        }
        const progress = getProgressMap();
        progress[currentVideoId] = current;
        storageSet(PROGRESS_KEY, JSON.stringify(progress));
      }

      function stopProgressSaving() {
        if (progressIntervalId !== null) {
          window.clearInterval(progressIntervalId);
          progressIntervalId = null;
        }
      }

      function startProgressSaving() {
        // Always clear first so video transitions can never stack intervals.
        stopProgressSaving();
        progressIntervalId = window.setInterval(saveProgress, 1000);
      }

      function syncPlaybackRateUi(rateOverride) {
        playbackRate = normalizePlaybackRate(rateOverride ?? playbackRate ?? getSavedSpeed());
        storageSet(SPEED_KEY, String(playbackRate));
      }

      function applySavedSpeed() {
        const speed = getSavedSpeed();
        playbackRate = speed;
        syncPlaybackRateUi(speed);
        if (player && typeof player.setPlaybackRate === "function") {
          try {
            player.setPlaybackRate(speed);
          } catch (error) {
            // The API may briefly reject a rate while a new video is loading.
          }
        }
      }

      function showConfirm(action) {
        pendingAction = action;
        clearCustomUiHideTimer();
        videoShell.classList.remove("ui-idle");
        videoShell.classList.add("modal-open");
        confirmInput.value = "";
        confirmInput.classList.remove("invalid");
        confirmModal.hidden = false;
        window.setTimeout(() => confirmInput.focus(), 0);
      }

      function closeConfirm() {
        pendingAction = null;
        confirmInput.value = "";
        confirmInput.classList.remove("invalid");
        confirmModal.hidden = true;
        videoShell.classList.remove("modal-open");
        revealCustomUi();
      }

      function closeAndReset() {
        allowPageUnload = true;
        stopProgressSaving();
        storageRemove(PLAYLIST_KEY);
        storageRemove(INDEX_KEY);
        storageRemove(PROGRESS_KEY);
        window.location.reload();
      }

      function performConfirmedAction() {
        const action = pendingAction;
        pendingAction = null;
        confirmInput.value = "";
        confirmModal.hidden = true;
        videoShell.classList.remove("modal-open");
        clearCustomUiHideTimer();

        if (action === "close") {
          closeAndReset();
          return;
        }

        if (action === "navigate") {
          saveProgress();
          allowPageUnload = true;
          window.history.back();
          return;
        }
      }

      function checkConfirmation() {
        if (ACCEPTED_TEXTS.includes(confirmInput.value)) {
          performConfirmedAction();
          return;
        }
        confirmInput.value = "";
        confirmInput.classList.remove("invalid");
        // Force a reflow so the animation can replay on consecutive failures.
        void confirmInput.offsetWidth;
        confirmInput.classList.add("invalid");
      }

      function handleFullscreenChange() {
        if (document.fullscreenElement) {
          revealCustomUi();
        } else {
          pinCustomUiVisible();
        }
      }

      function playNext() {
        if (!playlist.length) {
          return;
        }

        saveProgress();
        stopProgressSaving();
        isPlaying = false;
        currentIndex += 1;
        persistIndex();

        if (currentIndex >= playlist.length) {
          currentVideoId = "";
          isPlaying = false;
          updatePositionLabel();
          setPlayerMessage("Playlist finished", false);
          return;
        }

        const nextVideoId = playlist[currentIndex];
        if (!validVideoId(nextVideoId)) {
          setPlayerMessage("This video ID is invalid and cannot be played.", true);
          return;
        }
        currentVideoId = nextVideoId;
        updatePositionLabel();
        clearPlayerMessage();

        if (!player || typeof player.loadVideoById !== "function") {
          setPlayerMessage("The player is not ready. Reload the page and try again.", false);
          return;
        }

        const resumeTime = getResumeTime(nextVideoId);
        player.loadVideoById(nextVideoId, resumeTime);
        // The next video's rate is applied after the load call, as well as in onReady.
        applySavedSpeed();
      }

      function playPrevious() {
        if (!playlist.length || currentIndex <= 0) {
          return;
        }

        saveProgress();
        stopProgressSaving();
        isPlaying = false;
        currentIndex -= 1;
        persistIndex();

        const previousVideoId = playlist[currentIndex];
        if (!validVideoId(previousVideoId)) {
          setPlayerMessage("This video ID is invalid and cannot be played.", true);
          return;
        }
        currentVideoId = previousVideoId;
        updatePositionLabel();
        clearPlayerMessage();

        if (!player || typeof player.loadVideoById !== "function") {
          setPlayerMessage("The player is not ready. Reload the page and try again.", false);
          return;
        }

        const resumeTime = getResumeTime(previousVideoId);
        player.loadVideoById(previousVideoId, resumeTime);
        applySavedSpeed();
      }

      function handlePlaybackRateChange(event) {
        const actualRate = Number(event && event.data !== undefined ? event.data : player && typeof player.getPlaybackRate === "function" ? player.getPlaybackRate() : playbackRate);
        if (!Number.isFinite(actualRate)) {
          return;
        }
        playbackRate = normalizePlaybackRate(actualRate);
        syncPlaybackRateUi(playbackRate);
      }

      function handlePlayerReady(event) {
        // The YouTube iframe is cross-origin, so internal mousemove events are not
        // visible to the parent. Boundary/focus events can still wake our custom UI.
        const playerFrame = typeof event.target.getIframe === "function" ? event.target.getIframe() : null;
        if (playerFrame && !playerFrame.dataset.focusUiBound) {
          playerFrame.dataset.focusUiBound = "true";
          playerFrame.addEventListener("pointerenter", revealCustomUi, { passive: true });
          playerFrame.addEventListener("pointerdown", revealCustomUi, { passive: true });
          playerFrame.addEventListener("focus", revealCustomUi);
        }

        currentVideoId = playlist[currentIndex] || "";
        const resumeTime = getResumeTime(currentVideoId);
        if (resumeTime > 0 && typeof event.target.seekTo === "function") {
          event.target.seekTo(resumeTime, true);
        }
        updatePositionLabel();
        event.target.playVideo();
        startProgressSaving();
        applySavedSpeed();
      }

      function handlePlayerStateChange(event) {
        const states = window.YT && window.YT.PlayerState;
        if (!states) {
          return;
        }

        // If a recommendation changes the iframe to a video outside the pasted queue,
        // immediately restore the queue's current item. Transparent shields also block
        // known external-link hotspots; this remains defensive rather than a perfect sandbox.
        if (event.data === states.PLAYING && player && typeof player.getVideoData === "function") {
          const activeVideoId = player.getVideoData().video_id;
          if (activeVideoId && activeVideoId !== currentVideoId) {
            const queuedVideoId = playlist[currentIndex];
            if (queuedVideoId && validVideoId(queuedVideoId)) {
              player.loadVideoById(queuedVideoId, getResumeTime(queuedVideoId));
              applySavedSpeed();
            }
            return;
          }
        }

        if (event.data === states.ENDED) {
          saveProgress();
          playNext();
          return;
        }

        if (event.data === states.PLAYING) {
          clearPlayerMessage();
          isPlaying = true;
          startProgressSaving();
          revealCustomUi();
          return;
        }

        if (event.data === states.PAUSED || event.data === states.CUED) {
          saveProgress();
          stopProgressSaving();
          isPlaying = false;
          pinCustomUiVisible();
        }
      }

      function handlePlayerError(event) {
        stopProgressSaving();
        isPlaying = false;
        setPlayerMessage(`Playback failed for this video (error ${event.data}).`, currentIndex < playlist.length - 1);
      }

      function createPlayer() {
        if (player || currentIndex >= playlist.length) {
          return;
        }
        if (window.focusPlayerApiFailed || !window.YT || typeof window.YT.Player !== "function") {
          showApiError();
          return;
        }
        const videoId = playlist[currentIndex];
        if (!validVideoId(videoId)) {
          setPlayerMessage("This video ID is invalid and cannot be played.", false);
          return;
        }

        player = new YT.Player("player", {
          videoId,
          playerVars: {
            controls: 1,
            rel: 0,
            playsinline: 1,
            fs: 1,
            disablekb: 0
            // Captions are not forced on by default.
          },
          events: {
            onReady: handlePlayerReady,
            onStateChange: handlePlayerStateChange,
            onError: handlePlayerError
          }
        });

        if (typeof player.addEventListener === "function") {
          player.addEventListener("onPlaybackRateChange", handlePlaybackRateChange);
        }
      }

      function bootPlayerWhenReady() {
        if (currentIndex >= playlist.length) {
          updatePositionLabel();
          setPlayerMessage("Playlist finished", false);
          return;
        }
        if (window.focusPlayerApiFailed) {
          showApiError();
          return;
        }
        if (window.YT && typeof window.YT.Player === "function") {
          createPlayer();
        }
      }

      function startSession(nextPlaylist) {
        if (!nextPlaylist.length) {
          window.alert("Please paste at least one valid YouTube link or video ID.");
          return;
        }
        playlist = nextPlaylist;
        currentIndex = 0;
        currentVideoId = playlist[0];
        allowPageUnload = false;
        installNavigationGuard();
        storageSet(PLAYLIST_KEY, JSON.stringify(playlist));
        persistIndex();
        showPlayerPage();
        setPlayerMessage("Loading your focus session...", false);
        updatePositionLabel();
        bootPlayerWhenReady();
      }

      function resumeStoredSession() {
        playlist = getStoredPlaylist();
        if (!playlist.length) {
          return;
        }

        // Parse the persisted index explicitly from its string storage value.
        currentIndex = parseInt(storageGet(INDEX_KEY) || "0", 10);
        if (!Number.isFinite(currentIndex) || currentIndex < 0) {
          currentIndex = 0;
        }
        currentVideoId = playlist[currentIndex] || "";
        allowPageUnload = false;
        installNavigationGuard();
        showPlayerPage();
        updatePositionLabel();
        if (currentIndex >= playlist.length) {
          setPlayerMessage("Playlist finished", false);
          return;
        }
        setPlayerMessage("Loading your focus session...", false);
        bootPlayerWhenReady();
      }

      startBtn.addEventListener("click", (event) => {
        event.currentTarget.blur();
        startSession(parseLinks(links.value));
      });

      errorNextBtn.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        playNext();
      });

      closeBtn.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        showConfirm("close");
      });

      ["titleShield", "endScreenShield"].forEach((shieldId) => {
        document.getElementById(shieldId).addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
        });
      });

      // Pointer activity outside the cross-origin iframe can be observed here.
      // The iframe itself does not expose its internal mouse events to this page;
      // its native control bar retains its own independent visibility behavior.
      activityOverlay.addEventListener("mousemove", revealCustomUi, { passive: true });
      window.addEventListener("mousemove", revealCustomUi, { passive: true });
      videoShell.addEventListener("pointermove", revealCustomUi, { passive: true });
      videoShell.addEventListener("pointerenter", revealCustomUi, { passive: true });
      videoShell.addEventListener("pointerdown", revealCustomUi, { passive: true });
      closeBtn.addEventListener("focus", pinCustomUiVisible);
      closeBtn.addEventListener("blur", () => {
        if (isPlaying) revealCustomUi();
      });

      modalCheck.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        checkConfirmation();
      });

      modalCancel.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        closeConfirm();
      });

      modalAbort.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        closeConfirm();
      });

      // Outside clicks dismiss the custom modal. The fixed backdrop consumes the click,
      // so it never leaks through to the player iframe beneath it.
      confirmModal.addEventListener("click", (event) => {
        if (event.target === confirmModal) {
          event.preventDefault();
          event.stopPropagation();
          closeConfirm();
        }
      });

      confirmInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          checkConfirmation();
          return;
        }
        if (event.ctrlKey || event.metaKey) {
          const key = event.key.toLowerCase();
          if (["c", "x", "v"].includes(key)) {
            event.preventDefault();
          }
        }
      });

      ["paste", "dragover", "drop"].forEach((eventName) => {
        confirmInput.addEventListener(eventName, (event) => {
          event.preventDefault();
        });
      });

      function isTypingElement(element) {
        return !!(element && (element.tagName === "INPUT" || element.tagName === "TEXTAREA" || element.tagName === "SELECT" || element.isContentEditable));
      }

      window.addEventListener("keydown", (event) => {
        const key = event.key;

        // Do not suppress browser fullscreen shortcuts. The page handles only its
        // own Shift+N/Shift+P playlist shortcuts; YouTube/native shortcuts pass through.
        if (!confirmModal.hidden) {
          return;
        }
        if (playerPage.style.display !== "block" || !event.shiftKey || isTypingElement(document.activeElement)) {
          return;
        }

        // These are the only app-level playback shortcuts. Space/K/J/L/arrows/volume
        // are deliberately left to YouTube's native controls when the iframe has focus.
        if (key === "n" || key === "N") {
          event.preventDefault();
          if (currentIndex < playlist.length - 1) playNext();
        } else if (key === "p" || key === "P") {
          event.preventDefault();
          if (currentIndex > 0) playPrevious();
        }
      });

      document.addEventListener("fullscreenchange", handleFullscreenChange);

      function installNavigationGuard() {
        if (navigationGuardInstalled) return;
        try {
          window.history.pushState({ focusPlayerGuard: true }, "", window.location.href);
          navigationGuardInstalled = true;
        } catch (error) {
          // Some embedded or file-based contexts restrict history manipulation.
        }
      }

      window.addEventListener("popstate", () => {
        if (allowPageUnload || !playlist.length || playerPage.style.display !== "block") return;
        try {
          window.history.pushState({ focusPlayerGuard: true }, "", window.location.href);
        } catch (error) {
          // The unload warning below remains the fallback guard.
        }
        showConfirm("navigate");
      });

      window.addEventListener("beforeunload", (event) => {
        if (allowPageUnload) return;
        saveProgress();
        if (playlist.length && playerPage.style.display === "block") {
          // Browsers intentionally forbid a custom sentence-typing modal during page unload.
          // The browser-native confirmation is the strongest available protection here.
          event.preventDefault();
          event.returnValue = "";
        }
      });

      window.focusPlayerBoot = () => {
        if (!window.focusPlayerApiFailed) {
          bootPlayerWhenReady();
        }
      };

      window.setTimeout(() => {
        if (!window.YT || typeof window.YT.Player !== "function") {
          showApiError();
        }
      }, 5000);

      playbackRate = getSavedSpeed();
      syncPlaybackRateUi(playbackRate);
      resumeStoredSession();
    })();
  </script>
</body>
</html>
